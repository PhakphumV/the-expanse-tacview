<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Expanse Tacview</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; color: #fff; }
        canvas { display: block; }
        #container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

        #timeline {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            border-top: 1px solid #333;
            box-sizing: border-box;
        }
        #timeline button {
            background: #222; color: #fff; border: 1px solid #555;
            padding: 4px 10px; font-family: monospace; cursor: pointer;
        }
        #timeline button:hover { background: #333; }
        #timeline select {
            background: #222; color: #fff; border: 1px solid #555;
            padding: 4px; font-family: monospace;
        }
        .mode-btn {
            background: #222; color: #fff; border: 1px solid #555;
            padding: 4px 10px; font-family: monospace; cursor: pointer;
        }
        .mode-btn.active {
            background: #3a7bd5;
            border-color: #3a7bd5;
        }
        #timeReadout {
            min-width: 110px;
            text-align: center;
            font-size: 14px;
            color: #7fd07f;
        }
        #scrubBar {
            position: relative;
            flex: 1;
            height: 16px;
            background: #1a1a1a;
            border: 1px solid #444;
            cursor: pointer;
            user-select: none;
        }
        #scrubProgress {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            background: linear-gradient(90deg, #2a5fa0, #3a7bd5);
            width: 0%;
        }
        #scrubHandle {
            position: absolute;
            top: -4px;
            width: 4px; height: 24px;
            background: #ffffff;
            margin-left: -2px;
            left: 0%;
            pointer-events: none;
        }
        .eventMarker {
            position: absolute;
            top: 0;
            width: 2px;
            height: 16px;
            background: #ffcc00;
            pointer-events: none;
        }
        .eventMarker.launch { background: #66aaff; }
        .eventMarker.intercept { background: #ffaa33; }
        .eventMarker.hit { background: #ff5555; }
        .eventMarker.miss { background: #aaaaaa; }
        .eventMarker.pdc_engage { background: #ffdd66; }
        .eventMarker.maneuver_start, .eventMarker.maneuver_end { background: #cc66ff; }
        .eventMarker.lock, .eventMarker.unlock { background: #ff66cc; }

        .hud-panel {
            position: fixed;
            top: 20px;
            width: 190px;
            background: rgba(0, 20, 0, 0.85);
            border: 1px solid;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.6;
            z-index: 10;
            font-family: 'Courier New', monospace;
        }
        #hud-roci {
            left: 20px;
            border-color: #3a7bd5;
            color: #7fd0ff;
        }
        #hud-zmeya {
            right: 20px;
            border-color: #d53a3a;
            color: #ff8080;
        }
        .hud-title {
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid currentColor;
            padding-bottom: 4px;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        .hud-lock {
            margin-top: 8px;
            padding: 4px 8px;
            text-align: center;
            font-weight: bold;
            border: 1px solid currentColor;
            background: rgba(0,0,0,0.4);
        }
        .hud-lock.on {
            color: #00ff00;
            background: rgba(0, 60, 0, 0.6);
            box-shadow: 0 0 8px #00ff00;
        }
        .hud-lock.off {
            color: #555;
        }
        .event-log {
            position: fixed;
            right: 20px;
            top: 260px;
            width: 280px;
            max-height: 320px;
            background: rgba(0, 20, 0, 0.88);
            border: 1px solid #555;
            color: #cccccc;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 8px 10px;
            overflow-y: auto;
            z-index: 10;
        }
        .event-log-title {
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #555;
            padding-bottom: 4px;
            margin-bottom: 6px;
            letter-spacing: 2px;
            color: #ffffff;
        }
        .event-log-entry {
            padding: 3px 4px;
            border-bottom: 1px solid #222;
            cursor: pointer;
        }
        .event-log-entry:hover {
            background: rgba(255,255,255,0.1);
        }
        .entity-label {
            position: absolute;
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border: 1px solid currentColor;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            z-index: 5;
        }
        #minimap {
            position: fixed;
            left: 20px;
            top: 260px;
            width: 160px;
            height: 160px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #555;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="container"></div>

    <div id="labelsContainer"></div>
    <canvas id="minimap" width="160" height="160"></canvas>

    <div id="hud-roci" class="hud-panel">
        <div class="hud-title">ROCI</div>
        <div id="roci-lock" class="hud-lock off">LOCK: OFF</div>
        <div>VEL: <span id="roci-vel">---</span> km/s</div>
        <div>G:&nbsp;&nbsp; <span id="roci-g">---</span></div>
        <div>RNG: <span id="roci-rng">---</span> km</div>
        <div>CLOS: <span id="roci-clos">---</span> km/s</div>
        <div>ASP: <span id="roci-asp">---</span>&deg;</div>
    </div>

    <div id="hud-zmeya" class="hud-panel">
        <div class="hud-title">ZMEYA</div>
        <div>VEL: <span id="zmeya-vel">---</span> km/s</div>
        <div>G:&nbsp;&nbsp; <span id="zmeya-g">---</span></div>
        <div>RNG: <span id="zmeya-rng">---</span> km</div>
        <div>CLOS: <span id="zmeya-clos">---</span> km/s</div>
        <div>ASP: <span id="zmeya-asp">---</span>&deg;</div>
    </div>

    <div id="eventLog" class="event-log">
        <div class="event-log-title">EVENT LOG</div>
        <div id="eventLogList"></div>
    </div>

    <div id="timeline">
        <button id="playPauseBtn">Pause</button>
        <span id="timeReadout">T+00:00.0</span>
        <div id="scrubBar">
            <div id="scrubProgress"></div>
            <div id="scrubHandle"></div>
            <div id="eventMarkers"></div>
        </div>
        <select id="speedSelect">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
        </select>
        <button id="modeOrbitBtn" class="mode-btn active">Orbit</button>
        <button id="modeChaseBtn" class="mode-btn">Chase</button>
        <button id="modeTopBtn" class="mode-btn">Top</button>
        <button id="trailsBtn">Trails: ON</button>
    </div>

    <script>
        (function () {
            const container = document.getElementById('container');

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            const camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                2000
            );
            camera.position.set(0, 120, 220);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const starCount = 6000;
            const starGeometry = new THREE.BufferGeometry();
            const starPositions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                const r = 800;
                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);
                starPositions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                starPositions[i * 3 + 2] = r * Math.cos(phi);
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.0,
                sizeAttenuation: false
            });
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            const hullMeshes = {};

            function makeHull(color) {
                const geom = new THREE.BoxGeometry(20, 10, 40);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                return new THREE.Mesh(geom, mat);
            }

            const rociMesh = makeHull(0x3a7bd5);
            scene.add(rociMesh);
            hullMeshes['roci'] = rociMesh;

            const zmeyaMesh = makeHull(0xd53a3a);
            scene.add(zmeyaMesh);
            hullMeshes['zmeya'] = zmeyaMesh;

            // Torpedo meshes
            const torpedoMeshes = {};
            // PDC tracer meshes
            const pdcMeshes = {};
            // Trails
            const trails = {};
            const TRAIL_SECONDS = 2.0;
            const TRAIL_SAMPLES = 30;
            let trailsVisible = true;

            function createTorpedoMesh() {
                const geom = new THREE.SphereGeometry(2.5, 8, 8);
                const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 1 });
                return new THREE.Mesh(geom, mat);
            }
            function createPdcMesh() {
                const geom = new THREE.BufferGeometry();
                const positions = new Float32Array(6);
                geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const mat = new THREE.LineBasicMaterial({ color: 0xffff66, transparent: true, opacity: 1 });
                return new THREE.Line(geom, mat);
            }
            function createTrail(color) {
                const geom = new THREE.BufferGeometry();
                const positions = new Float32Array(TRAIL_SAMPLES * 3);
                geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.7 });
                const line = new THREE.Line(geom, mat);
                line.frustumCulled = false;
                return line;
            }
            window.addEventListener('keydown', function (e) {
                if (e.key === 't' || e.key === 'T') {
                    trailsVisible = !trailsVisible;
                    const btn = document.getElementById('trailsBtn');
                    if (btn) btn.textContent = trailsVisible ? 'Trails: ON' : 'Trails: OFF';
                }
            });

            // Burst effects for intercept/hit events
            const bursts = [];
            const BURST_DURATION = 1.0;
            function createBurstMesh(color) {
                const geom = new THREE.SphereGeometry(5, 16, 16);
                const mat = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                });
                return new THREE.Mesh(geom, mat);
            }

            // Labels and minimap
            const labels = {};
            const minimapCanvas = document.getElementById('minimap');
            const minimapCtx = minimapCanvas.getContext('2d');
            let minimapBounds = null;

            function computeMinimapBounds() {
                const ents = PlaybackEngine.getEntities();
                let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
                for (const id in ents) {
                    const kfs = ents[id].keyframes;
                    for (const k of kfs) {
                        if (k.pos.x < minX) minX = k.pos.x;
                        if (k.pos.x > maxX) maxX = k.pos.x;
                        if (k.pos.z < minZ) minZ = k.pos.z;
                        if (k.pos.z > maxZ) maxZ = k.pos.z;
                    }
                }
                const pad = 20;
                minimapBounds = {
                    minX: minX - pad, maxX: maxX + pad,
                    minZ: minZ - pad, maxZ: maxZ + pad
                };
            }

            function drawMinimap(t) {
                if (!minimapBounds) return;
                const ctx = minimapCtx;
                const w = minimapCanvas.width;
                const h = minimapCanvas.height;
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 1;
                ctx.strokeRect(0, 0, w, h);
                const stateMap = PlaybackEngine.getStateAtTime(t);
                function project(x, z) {
                    const u = (x - minimapBounds.minX) / (minimapBounds.maxX - minimapBounds.minX);
                    const v = (z - minimapBounds.minZ) / (minimapBounds.maxZ - minimapBounds.minZ);
                    return [u * w, v * h];
                }
                const ships = ['roci', 'zmeya'];
                ships.forEach(function (id) {
                    const s = stateMap[id];
                    if (s && s.active) {
                        const [px, py] = project(s.position.x, s.position.z);
                        ctx.fillStyle = id === 'roci' ? '#3a7bd5' : '#d53a3a';
                        ctx.beginPath();
                        ctx.arc(px, py, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.font = '10px monospace';
                        ctx.fillText(id.toUpperCase(), px + 6, py + 4);
                    }
                });
                const ents = PlaybackEngine.getEntities();
                for (const id in ents) {
                    if (ents[id].type === 'torpedo') {
                        const s = stateMap[id];
                        if (s && s.active) {
                            const [px, py] = project(s.position.x, s.position.z);
                            ctx.fillStyle = '#ffaa00';
                            ctx.beginPath();
                            ctx.arc(px, py, 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }

            function updateLabels() {
                const t = PlaybackEngine.getTime();
                const stateMap = PlaybackEngine.getStateAtTime(t);
                const widthHalf = window.innerWidth / 2;
                const heightHalf = window.innerHeight / 2;
                camera.updateMatrixWorld();
                for (const id in labels) {
                    const s = stateMap[id];
                    const el = labels[id];
                    if (s && s.active) {
                        const pos = s.position.clone().project(camera);
                        if (pos.z > 1) { el.style.display = 'none'; continue; }
                        const x = (pos.x * widthHalf) + widthHalf;
                        const y = -(pos.y * heightHalf) + heightHalf;
                        el.style.left = x + 'px';
                        el.style.top = y + 'px';
                        el.style.display = 'block';
                    } else {
                        el.style.display = 'none';
                    }
                }
            }

            // ---- Playback engine ----
            const PlaybackEngine = (function () {
                const state = {
                    dataset: null,
                    entities: {},
                    duration: 0,
                    currentTime: 0,
                    speed: 1.0,
                    playing: true,
                };

                function load(json) {
                    state.dataset = json;
                    state.duration = json.duration;
                    state.entities = {};
                    json.entities.forEach(function (e) {
                        const kfs = e.keyframes.map(function (k) {
                            return {
                                t: k.t,
                                pos: new THREE.Vector3(k.position[0], k.position[1], k.position[2]),
                                vel: new THREE.Vector3(k.velocity[0], k.velocity[1], k.velocity[2]),
                                q: new THREE.Quaternion(k.orientation[0], k.orientation[1], k.orientation[2], k.orientation[3])
                            };
                        });
                        state.entities[e.id] = { type: e.type, iff: e.iff, keyframes: kfs };
                    });
                }

                function getStateAtTime(t) {
                    const out = {};
                    for (const id in state.entities) {
                        const ent = state.entities[id];
                        const kfs = ent.keyframes;
                        if (kfs.length === 0) { out[id] = { active: false }; continue; }
                        if (t < kfs[0].t || t > kfs[kfs.length - 1].t) { out[id] = { active: false }; continue; }
                        let i = 0;
                        while (i < kfs.length - 1 && kfs[i + 1].t < t) i++;
                        if (i >= kfs.length - 1) {
                            out[id] = {
                                active: true,
                                position: kfs[kfs.length - 1].pos.clone(),
                                velocity: kfs[kfs.length - 1].vel.clone(),
                                orientation: kfs[kfs.length - 1].q.clone(),
                            };
                            continue;
                        }
                        const a = kfs[i];
                        const b = kfs[i + 1];
                        const span = b.t - a.t;
                        const alpha = span > 0 ? (t - a.t) / span : 0;
                        const pos = new THREE.Vector3().copy(a.pos).lerp(b.pos, alpha);
                        const vel = new THREE.Vector3().copy(a.vel).lerp(b.vel, alpha);
                        const q = new THREE.Quaternion().copy(a.q).slerp(b.q, alpha);
                        out[id] = { active: true, position: pos, velocity: vel, orientation: q };
                    }
                    return out;
                }

                function getEventsUpTo(t) {
                    if (!state.dataset) return [];
                    return state.dataset.events.filter(function (ev) { return ev.t <= t; });
                }

                function setTime(t) { state.currentTime = Math.max(0, Math.min(t, state.duration)); }
                function getTime() { return state.currentTime; }
                function setSpeed(s) { state.speed = s; }
                function getSpeed() { return state.speed; }
                function play() { state.playing = true; }
                function pause() { state.playing = false; }
                function isPlaying() { return state.playing; }
                function getDuration() { return state.duration; }
                function getEntities() { return state.entities; }
                function getEvents() { return state.dataset ? state.dataset.events : []; }

                return {
                    load: load,
                    getStateAtTime: getStateAtTime,
                    getEventsUpTo: getEventsUpTo,
                    setTime: setTime,
                    getTime: getTime,
                    setSpeed: setSpeed,
                    getSpeed: getSpeed,
                    play: play,
                    pause: pause,
                    isPlaying: isPlaying,
                    getDuration: getDuration,
                    getEntities: getEntities,
                    getEvents: getEvents,
                };
            })();

            window.TacviewPlayback = PlaybackEngine;

            // ---- Derived telemetry ----
            const Telemetry = (function () {
                const G = 9.8;

                // Find index i such that keyframes[i].t <= t <= keyframes[i+1].t
                function findBracket(kfs, t) {
                    if (kfs.length === 0) return null;
                    if (t <= kfs[0].t) return { a: kfs[0], b: kfs[0], edge: 'before' };
                    if (t >= kfs[kfs.length - 1].t) {
                        const last = kfs.length - 1;
                        return { a: kfs[last - 1] || kfs[last], b: kfs[last], edge: 'after' };
                    }
                    let i = 0;
                    while (i < kfs.length - 1 && kfs[i + 1].t < t) i++;
                    return { a: kfs[i], b: kfs[i + 1], edge: 'inside' };
                }

                function gForceForEntity(ent, t) {
                    const kfs = ent.keyframes;
                    if (kfs.length < 2) return 0;
                    const bracket = findBracket(kfs, t);
                    if (!bracket) return 0;
                    const a = bracket.a, b = bracket.b;
                    const dt = b.t - a.t;
                    if (dt <= 0) return 0;
                    const dv = new THREE.Vector3().subVectors(b.vel, a.vel);
                    const aMag = dv.length() / dt;
                    return aMag / G;
                }

                function aspectAngleDeg(shipPos, shipQuat, otherPos) {
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(shipQuat).normalize();
                    const dir = new THREE.Vector3().subVectors(otherPos, shipPos);
                    const dist = dir.length();
                    if (dist < 1e-6) return 0;
                    dir.normalize();
                    const dot = THREE.MathUtils.clamp(forward.dot(dir), -1, 1);
                    return Math.acos(dot) * 180 / Math.PI;
                }

                function computeForPair(stateMap, idA, idB, t) {
                    const a = stateMap[idA], b = stateMap[idB];
                    if (!a || !b || !a.active || !b.active) return null;
                    const range = new THREE.Vector3().subVectors(b.position, a.position).length();
                    const relVel = new THREE.Vector3().subVectors(b.velocity, a.velocity);
                    const sep = new THREE.Vector3().subVectors(b.position, a.position);
                    let closure = 0;
                    if (range > 1e-6) {
                        closure = sep.dot(relVel) / range; // positive = closing
                    }
                    const ents = PlaybackEngine.getEntities();
                    return {
                        range: range,
                        closureRate: closure,
                        gForceA: gForceForEntity(ents[idA], t),
                        gForceB: gForceForEntity(ents[idB], t),
                        aspectAngleA: aspectAngleDeg(a.position, a.orientation, b.position),
                        aspectAngleB: aspectAngleDeg(b.position, b.orientation, a.position),
                    };
                }

                function getDerived(t) {
                    const stateMap = PlaybackEngine.getStateAtTime(t);
                    const pair = computeForPair(stateMap, 'roci', 'zmeya', t);
                    if (!pair) return null;
                    return {
                        roci: {
                            gForce: pair.gForceA,
                            aspectAngle: pair.aspectAngleA,
                            range: pair.range,
                            closureRate: pair.closureRate,
                        },
                        zmeya: {
                            gForce: pair.gForceB,
                            aspectAngle: pair.aspectAngleB,
                            range: pair.range,
                            closureRate: pair.closureRate,
                        },
                    };
                }

                return { getDerived: getDerived };
            })();

            window.TacviewTelemetry = Telemetry;

            // ---- Lock state (driven by discrete events, not physics) ----
            const LockState = (function () {
                let intervals = []; // [{start, end}]
                function build() {
                    intervals = [];
                    const events = PlaybackEngine.getEvents().slice().sort(function (a, b) { return a.t - b.t; });
                    let open = null;
                    events.forEach(function (ev) {
                        if (ev.type === 'lock') {
                            if (!open) open = { start: ev.t, end: Infinity };
                        } else if (ev.type === 'unlock') {
                            if (open) { open.end = ev.t; intervals.push(open); open = null; }
                        }
                    });
                    if (open) intervals.push(open);
                }
                function isLockedAt(t) {
                    for (let i = 0; i < intervals.length; i++) {
                        if (t >= intervals[i].start && t < intervals[i].end) return true;
                    }
                    return false;
                }
                return { build: build, isLockedAt: isLockedAt };
            })();

            window.TacviewLockState = LockState;

            // ---- Camera mode controller ----
            const CameraMode = (function () {
                let mode = 'orbit';
                const OFFSET = new THREE.Vector3(0, 12, 40);
                function setMode(m) {
                    mode = m;
                    controls.enabled = (m === 'orbit');
                    const o = document.getElementById('modeOrbitBtn');
                    const c = document.getElementById('modeChaseBtn');
                    const tp = document.getElementById('modeTopBtn');
                    if (o) o.classList.toggle('active', m === 'orbit');
                    if (c) c.classList.toggle('active', m === 'chase');
                    if (tp) tp.classList.toggle('active', m === 'top');
                }
                function getMode() { return mode; }
                function update(t) {
                    const stateMap = PlaybackEngine.getStateAtTime(t);
                    const roci = stateMap['roci'];
                    const zmeya = stateMap['zmeya'];
                    if (mode === 'chase' && roci && roci.active) {
                        const offsetWorld = OFFSET.clone().applyQuaternion(roci.orientation);
                        camera.position.copy(roci.position).add(offsetWorld);
                        camera.up.set(0, 1, 0);
                        camera.lookAt(roci.position);
                    } else if (mode === 'top' && roci && roci.active && zmeya && zmeya.active) {
                        const mid = new THREE.Vector3().addVectors(roci.position, zmeya.position).multiplyScalar(0.5);
                        camera.position.set(mid.x, mid.y + 150, mid.z + 1);
                        camera.up.set(0, 0, -1);
                        camera.lookAt(mid);
                    }
                }
                return { setMode: setMode, getMode: getMode, update: update };
            })();

            // ---- Timeline UI ----
            const playPauseBtn = document.getElementById('playPauseBtn');
            const timeReadout = document.getElementById('timeReadout');
            const scrubBar = document.getElementById('scrubBar');
            const scrubProgress = document.getElementById('scrubProgress');
            const scrubHandle = document.getElementById('scrubHandle');
            const eventMarkersEl = document.getElementById('eventMarkers');
            const speedSelect = document.getElementById('speedSelect');

            playPauseBtn.addEventListener('click', function () {
                if (PlaybackEngine.isPlaying()) {
                    PlaybackEngine.pause();
                    playPauseBtn.textContent = 'Play';
                } else {
                    PlaybackEngine.play();
                    playPauseBtn.textContent = 'Pause';
                }
            });

            speedSelect.addEventListener('change', function () {
                PlaybackEngine.setSpeed(parseFloat(speedSelect.value));
            });

            const trailsBtn = document.getElementById('trailsBtn');
            trailsBtn.addEventListener('click', function () {
                trailsVisible = !trailsVisible;
                trailsBtn.textContent = trailsVisible ? 'Trails: ON' : 'Trails: OFF';
            });

            document.getElementById('modeOrbitBtn').addEventListener('click', function () { CameraMode.setMode('orbit'); });
            document.getElementById('modeChaseBtn').addEventListener('click', function () { CameraMode.setMode('chase'); });
            document.getElementById('modeTopBtn').addEventListener('click', function () { CameraMode.setMode('top'); });

            let scrubbing = false;
            function scrubFromEvent(e) {
                const rect = scrubBar.getBoundingClientRect();
                const x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - rect.left;
                let frac = Math.max(0, Math.min(1, x / rect.width));
                const dur = PlaybackEngine.getDuration();
                PlaybackEngine.setTime(frac * dur);
            }
            scrubBar.addEventListener('mousedown', function (e) {
                scrubbing = true;
                scrubFromEvent(e);
            });
            window.addEventListener('mousemove', function (e) {
                if (scrubbing) scrubFromEvent(e);
            });
            window.addEventListener('mouseup', function () { scrubbing = false; });

            function formatTime(t) {
                const m = Math.floor(t / 60);
                const s = t - m * 60;
                return 'T+' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
            }

            function populateEventMarkers() {
                eventMarkersEl.innerHTML = '';
                const events = PlaybackEngine.getEvents();
                const dur = PlaybackEngine.getDuration();
                if (!dur) return;
                events.forEach(function (ev) {
                    const m = document.createElement('div');
                    m.className = 'eventMarker ' + ev.type;
                    m.style.left = (ev.t / dur * 100) + '%';
                    m.title = ev.type + (ev.detail ? ': ' + ev.detail : '');
                    eventMarkersEl.appendChild(m);
                });
            }

            function updateTimelineUI() {
                const t = PlaybackEngine.getTime();
                const dur = PlaybackEngine.getDuration();
                if (dur > 0) {
                    const frac = t / dur;
                    scrubProgress.style.width = (frac * 100) + '%';
                    scrubHandle.style.left = (frac * 100) + '%';
                }
                timeReadout.textContent = formatTime(t);
            }

            function setVal(id, v) { document.getElementById(id).textContent = v; }
            function updateHUD() {
                const t = PlaybackEngine.getTime();
                const derived = Telemetry.getDerived(t);
                const stateMap = PlaybackEngine.getStateAtTime(t);

                if (derived && stateMap['roci'] && stateMap['roci'].active) {
                    const vel = stateMap['roci'].velocity.length() / 1000;
                    setVal('roci-vel', vel.toFixed(2));
                    setVal('roci-g', derived.roci.gForce.toFixed(2));
                    setVal('roci-rng', (derived.roci.range / 1000).toFixed(2));
                    setVal('roci-clos', (derived.roci.closureRate / 1000).toFixed(2));
                    setVal('roci-asp', derived.roci.aspectAngle.toFixed(1));
                } else {
                    ['roci-vel','roci-g','roci-rng','roci-clos','roci-asp'].forEach(function (id) { setVal(id, '---'); });
                }
                if (derived && stateMap['zmeya'] && stateMap['zmeya'].active) {
                    const vel = stateMap['zmeya'].velocity.length() / 1000;
                    setVal('zmeya-vel', vel.toFixed(2));
                    setVal('zmeya-g', derived.zmeya.gForce.toFixed(2));
                    setVal('zmeya-rng', (derived.zmeya.range / 1000).toFixed(2));
                    setVal('zmeya-clos', (derived.zmeya.closureRate / 1000).toFixed(2));
                    setVal('zmeya-asp', derived.zmeya.aspectAngle.toFixed(1));
                } else {
                    ['zmeya-vel','zmeya-g','zmeya-rng','zmeya-clos','zmeya-asp'].forEach(function (id) { setVal(id, '---'); });
                }

                // Radar lock indicator (event-driven, correct on scrub)
                const lockEl = document.getElementById('roci-lock');
                const locked = LockState.isLockedAt(PlaybackEngine.getTime());
                if (locked) {
                    lockEl.textContent = 'LOCK: ON';
                    lockEl.classList.add('on');
                    lockEl.classList.remove('off');
                } else {
                    lockEl.textContent = 'LOCK: OFF';
                    lockEl.classList.add('off');
                    lockEl.classList.remove('on');
                }
            }

            // Event log entries
            const eventLogEntries = [];
            function updateLog() {
                const t = PlaybackEngine.getTime();
                const list = document.getElementById('eventLogList');
                let lastVisible = null;
                for (let i = 0; i < eventLogEntries.length; i++) {
                    const e = eventLogEntries[i];
                    if (e.ev.t <= t) {
                        e.el.style.display = 'block';
                        lastVisible = e.el;
                    } else {
                        e.el.style.display = 'none';
                    }
                }
                if (lastVisible) {
                    list.scrollTop = lastVisible.offsetTop;
                }
            }

            fetch('data/engagement.json')
                .then(function (r) { return r.json(); })
                .then(function (json) {
                    PlaybackEngine.load(json);
                    LockState.build();
                    const ents = PlaybackEngine.getEntities();
                    for (const id in ents) {
                        const e = ents[id];
                        if (e.type === 'torpedo') {
                            const m = createTorpedoMesh();
                            scene.add(m);
                            torpedoMeshes[id] = m;
                            trails[id] = createTrail(0xffaa00);
                            scene.add(trails[id]);
                        } else if (e.type === 'pdc_round') {
                            const m = createPdcMesh();
                            scene.add(m);
                            pdcMeshes[id] = { mesh: m, mat: m.material };
                        } else if (e.type === 'ship') {
                            trails[id] = createTrail(id === 'roci' ? 0x3a7bd5 : 0xd53a3a);
                            scene.add(trails[id]);
                        }
                    }
                    // Burst effects for intercept/hit events
                    for (const ev of json.events) {
                        if (ev.type === 'intercept' || ev.type === 'hit') {
                            const sMap = PlaybackEngine.getStateAtTime(ev.t);
                            const s = sMap[ev.entity_id];
                            if (s && s.active) {
                                const color = ev.type === 'hit' ? 0xff3333 : 0xffaa33;
                                const mesh = createBurstMesh(color);
                                mesh.position.copy(s.position);
                                mesh.visible = false;
                                scene.add(mesh);
                                bursts.push({ mesh: mesh, startTime: ev.t, duration: BURST_DURATION });
                            }
                        }
                    }
                    // Compute minimap bounds and create ship labels
                    computeMinimapBounds();
                    const labelsContainer = document.getElementById('labelsContainer');
                    labelsContainer.innerHTML = '';
                    ['roci', 'zmeya'].forEach(function (id) {
                        const el = document.createElement('div');
                        el.className = 'entity-label';
                        el.textContent = id === 'roci' ? 'ROCI' : 'ZMEYA';
                        el.style.color = id === 'roci' ? '#7fd0ff' : '#ff8080';
                        labelsContainer.appendChild(el);
                        labels[id] = el;
                    });
                    // Populate event log
                    eventLogEntries.length = 0;
                    const eventLogList = document.getElementById('eventLogList');
                    eventLogList.innerHTML = '';
                    json.events.forEach(function (ev) {
                        const entry = document.createElement('div');
                        entry.className = 'event-log-entry';
                        entry.textContent = formatTime(ev.t) + ' — ' + (ev.detail || ev.type);
                        entry.title = 'Jump to ' + formatTime(ev.t);
                        entry.addEventListener('click', function () {
                            PlaybackEngine.setTime(ev.t);
                        });
                        eventLogList.appendChild(entry);
                        eventLogEntries.push({ el: entry, ev: ev });
                    });
                    populateEventMarkers();
                    updateMeshes(0);
                    updateTimelineUI();
                    updateHUD();
                })
                .catch(function (err) {
                    console.error('Failed to load dataset:', err);
                });

            const trailHistory = {};
            function pushHistory(id, t, pos) {
                if (!trailHistory[id]) trailHistory[id] = [];
                const arr = trailHistory[id];
                arr.push({ t: t, pos: pos.clone() });
                while (arr.length > 0 && t - arr[0].t > TRAIL_SECONDS) arr.shift();
            }

            function updateMeshes(t) {
                const stateMap = PlaybackEngine.getStateAtTime(t);
                const ents = PlaybackEngine.getEntities();

                // Ships
                for (const id in hullMeshes) {
                    const mesh = hullMeshes[id];
                    const s = stateMap[id];
                    if (s && s.active) {
                        mesh.visible = true;
                        mesh.position.copy(s.position);
                        mesh.quaternion.copy(s.orientation);
                        pushHistory(id, t, s.position);
                    } else {
                        mesh.visible = false;
                    }
                }

                // Torpedoes
                for (const id in torpedoMeshes) {
                    const mesh = torpedoMeshes[id];
                    const s = stateMap[id];
                    const e = ents[id];
                    if (s && s.active && e && e.keyframes.length) {
                        mesh.visible = true;
                        mesh.position.copy(s.position);
                        const kfs = e.keyframes;
                        const fade = 0.5;
                        let op = 1;
                        if (t < kfs[0].t + fade) op = Math.max(0, (t - kfs[0].t) / fade);
                        else if (t > kfs[kfs.length - 1].t - fade) op = Math.max(0, (kfs[kfs.length - 1].t - t) / fade);
                        mesh.material.opacity = op;
                        pushHistory(id, t, s.position);
                    } else {
                        mesh.visible = false;
                    }
                }

                // PDC rounds (line segments)
                for (const id in pdcMeshes) {
                    const entry = pdcMeshes[id];
                    const s = stateMap[id];
                    const e = ents[id];
                    if (s && s.active && e && e.keyframes.length >= 2) {
                        entry.mesh.visible = true;
                        const a = e.keyframes[0];
                        const b = e.keyframes[1];
                        const span = b.t - a.t;
                        const alpha = span > 0 ? Math.min(1, Math.max(0, (t - a.t) / span)) : 0;
                        const pos = new THREE.Vector3().copy(a.pos).lerp(b.pos, alpha);
                        const positions = entry.mesh.geometry.attributes.position.array;
                        positions[0] = a.pos.x; positions[1] = a.pos.y; positions[2] = a.pos.z;
                        positions[3] = pos.x;    positions[4] = pos.y;    positions[5] = pos.z;
                        entry.mesh.geometry.attributes.position.needsUpdate = true;
                        let op = 1;
                        if (t < a.t + 0.05) op = (t - a.t) / 0.05;
                        else if (t > b.t - 0.1) op = Math.max(0, (b.t - t) / 0.1);
                        entry.mat.opacity = op;
                    } else {
                        entry.mesh.visible = false;
                    }
                }

                // Trails
                for (const id in trails) {
                    const line = trails[id];
                    if (!trailsVisible) { line.visible = false; continue; }
                    const arr = trailHistory[id];
                    if (!arr || arr.length < 2) { line.visible = false; continue; }
                    line.visible = true;
                    const positions = line.geometry.attributes.position.array;
                    for (let i = 0; i < TRAIL_SAMPLES; i++) {
                        const u = i / (TRAIL_SAMPLES - 1);
                        const targetT = t - TRAIL_SECONDS * (1 - u);
                        let p = arr[arr.length - 1].pos;
                        for (let j = 1; j < arr.length; j++) {
                            if (arr[j].t >= targetT) {
                                const a2 = arr[j - 1], b2 = arr[j];
                                const dt = b2.t - a2.t;
                                const alpha = dt > 0 ? (targetT - a2.t) / dt : 0;
                                p = new THREE.Vector3().copy(a2.pos).lerp(b2.pos, alpha);
                                break;
                            }
                        }
                        positions[i * 3]     = p.x;
                        positions[i * 3 + 1] = p.y;
                        positions[i * 3 + 2] = p.z;
                    }
                    line.geometry.attributes.position.needsUpdate = true;
                }

                // Bursts
                for (const b of bursts) {
                    const elapsed = t - b.startTime;
                    if (elapsed < 0 || elapsed > b.duration) {
                        b.mesh.visible = false;
                    } else {
                        b.mesh.visible = true;
                        const u = elapsed / b.duration;
                        b.mesh.material.opacity = 1 - u;
                        const scale = 1 + u * 2;
                        b.mesh.scale.setScalar(scale);
                    }
                }
            }

            function onResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
            window.addEventListener('resize', onResize);

            let lastT = performance.now();
            function animate() {
                requestAnimationFrame(animate);
                const now = performance.now();
                const dt = (now - lastT) / 1000;
                lastT = now;

                if (!scrubbing && PlaybackEngine.isPlaying() && PlaybackEngine.getDuration() > 0) {
                    let t = PlaybackEngine.getTime() + dt * PlaybackEngine.getSpeed();
                    if (t > PlaybackEngine.getDuration()) t = PlaybackEngine.getDuration();
                    PlaybackEngine.setTime(t);
                }
                updateMeshes(PlaybackEngine.getTime());
                updateTimelineUI();
                updateHUD();
                updateLog();
                updateLabels();
                drawMinimap(PlaybackEngine.getTime());
                CameraMode.update(PlaybackEngine.getTime());

                controls.update();
                stars.rotation.y += 0.0005;
                stars.rotation.x += 0.0002;
                renderer.render(scene, camera);
            }
            animate();
        })();
    </script>
</body>
</html>
